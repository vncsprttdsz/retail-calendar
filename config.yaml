# Configuração do calendário de resultados (B3 -> Outlook)

calendario:
  nome: "Resultados - Cobertura Varejo"
  descricao: "Datas de divulgação de resultados das empresas da cobertura (fonte: B3 - Cronograma de Eventos Corporativos)"
  fuso: "America/Sao_Paulo"
  # Duração usada quando a B3 informa horário (eventos sem horário viram "dia inteiro").
  duracao_minutos: 60

fonte:
  pagina: "https://www.b3.com.br/pt_br/produtos-e-servicos/negociacao/renda-variavel/acoes/consultas/cronograma-de-eventos-corporativos/"
  # Opcional: URL direta do arquivo (xlsx/xls/csv). Se vazio, o link é descoberto na página.
  url_arquivo: ""
  # Opcional: força o mapeamento de colunas caso a detecção automática erre.
  # Rode `python -m calendario_b3 --inspecionar` para ver as colunas do arquivo.
  # Chaves aceitas: empresa, codigo, evento, data, hora, periodo
  colunas: {}

eventos:
  # Só entram eventos cujo texto (evento/período/cabeçalho) casa com algum destes
  # padrões (regex, sem diferenciar maiúsculas/acentos). Use incluir_todos: true para
  # levar todos os eventos corporativos das empresas da cobertura.
  incluir_todos: false
  palavras_chave:
    - "resultado"
    - "\\bITR\\b"
    - "\\bDFP\\b"
    - "demonstra"            # demonstrações financeiras
    - "informa.{0,5}trimestra"
    - "teleconfer"
    - "conference call"
    - "webcast"
    - "earnings"

# Empresas da cobertura: lidas do retail-coverage (config/coverage.yaml), o mesmo
# universo do dashboard. Só entram as empresas com exchange B3 (MELI fica de fora).
# O workflow baixa o arquivo para _coverage/; localmente, aponte com COVERAGE_FILE=...
# O ticker casa pela raiz (LREN3 -> LREN). Os nomes servem quando a planilha da B3
# só traz a razão social, sem código.
cobertura:
  arquivo: "_coverage/config/coverage.yaml"
  # Razões sociais / nomes na B3 que diferem do `name` do dashboard.
  nomes_extras:
    AZZA3: ["Azzas 2154", "Arezzo"]
    CEAB3: ["C&A Modas"]
    RIAA3: ["Guararapes", "Riachuelo"]
    LREN3: ["Lojas Renner"]
    TFCO4: ["Track & Field", "Track Field"]
    ASAI3: ["Sendas Distribuidora", "Assai Atacadista"]
    GMAT3: ["Mateus Supermercados"]
    PGMN3: ["Empreendimentos Pague Menos"]
    PNVL3: ["Dimed"]
    RADL3: ["Raia Drogasil", "RD Saude"]
    ALLD3: ["Allied Tecnologia"]
    LJQQ3: ["Quero-Quero"]
    NATU3: ["Natura Cosmeticos", "Natura &Co"]
    AUAU3: ["Petz", "Cobasi"]
    SMFT3: ["Smartfit", "Smart Fit Escola"]
    VIVA3: ["Vivara Participacoes"]
  # Empresas fora do dashboard que você queira acompanhar mesmo assim:
  empresas: []
  #  - { ticker: XXXX3, nomes: ["Nome da Empresa"] }
