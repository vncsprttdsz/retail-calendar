# Configuração do calendário de resultados (B3 -> Outlook)

calendario:
  nome: "Resultados - Cobertura Varejo"
  descricao: "Datas de divulgação de resultados das empresas da cobertura (fonte: B3 - Cronograma de Eventos Corporativos)"
  fuso: "America/Sao_Paulo"
  # Duração usada quando a B3 informa horário (eventos sem horário viram "dia inteiro").
  duracao_minutos: 60

fonte:
  pagina: "https://www.b3.com.br/pt_br/produtos-e-servicos/negociacao/renda-variavel/acoes/consultas/cronograma-de-eventos-corporativos/"
  # Opcional: URL direta do arquivo (xlsx/xls/csv). Se vazio, o link é descoberto na página.
  url_arquivo: ""
  # Opcional: força o mapeamento de colunas caso a detecção automática erre.
  # Rode `python -m calendario_b3 --inspecionar` para ver as colunas do arquivo.
  # Chaves aceitas: empresa, codigo, evento, data, hora, periodo
  colunas: {}

eventos:
  # Só entram eventos cujo texto (evento/período/cabeçalho) casa com algum destes
  # padrões (regex, sem diferenciar maiúsculas/acentos). Use incluir_todos: true para
  # levar todos os eventos corporativos das empresas da cobertura.
  incluir_todos: false
  palavras_chave:
    - "resultado"
    - "\\bITR\\b"
    - "\\bDFP\\b"
    - "demonstra"            # demonstrações financeiras
    - "informa.{0,5}trimestra"
    - "teleconfer"
    - "conference call"
    - "webcast"
    - "earnings"

# Empresas da cobertura (universo do dashboard retail-coverage, só as listadas na B3;
# MELI fica de fora por ser NASDAQ). A planilha da B3 identifica a empresa só pelo
# NOME DE PREGÃO (ex.: "MAGAZ LUIZA", "CEA MODAS"): o primeiro nome de cada linha é ele.
# Rode o workflow com "inspecionar" para ver a lista completa de nomes do arquivo.
# cnpj: identifica a empresa nos documentos da CVM.
# ri: site(s) de Relações com Investidores: confere a data de divulgação e traz o call
#     (data, horário e link do webcast). Sites MZ são lidos pela API de eventos da MZ;
#     mz: id da companhia na MZ, quando o site não deixa descobrir (ex.: certificado inválido).
# manual: data fixada à mão, prevalece sobre B3 e CVM (ex.: { 3Q26: "2026-11-09" } ou
#         { 3Q26: "2026-11-09 18:00" }, horário de Brasília; sem horário = dia inteiro).
