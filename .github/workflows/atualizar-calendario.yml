name: Atualizar calendário de resultados

on:
  schedule:
    # 07:45, 11:45, 15:45 e 19:45 (horário de Brasília = UTC-3)
    - cron: "45 10,14,18,22 * * *"
  workflow_dispatch:
    inputs:
      inspecionar:
        description: "Só mostrar como o arquivo da B3 foi interpretado (não altera o calendário)"
        type: boolean
        default: false
      testar_aviso:
        description: "Só mandar mensagem de teste no WhatsApp e convite de teste por e-mail (não altera o calendário)"
        type: boolean
        default: false
      sondar:
        description: "Só diagnosticar estas URLs (vírgula): texto de PDF, links e APIs de páginas"
        type: string
        default: ""
      detalhar:
        description: "Com inspecionar: tickers para imprimir o calendário da CVM (ex.: MGLU3,TFCO4)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: atualizar-calendario
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # OCR de agendas publicadas como imagem nos pop-ups dos sites de RI (ex.: C&A).
      - run: sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-por > /dev/null

      - name: Inspecionar arquivo da B3
        if: ${{ inputs.inspecionar && !inputs.testar_aviso && !inputs.sondar }}
        env:
          DETALHAR: ${{ inputs.detalhar }}
        run: python -m calendario_b3 --inspecionar --detalhar "$DETALHAR"

      - name: Sondar URLs
        if: ${{ inputs.sondar }}
        env:
          SONDAR: ${{ inputs.sondar }}
        run: python -m calendario_b3 --sondar "$SONDAR"

      - name: Testar aviso
        if: ${{ inputs.testar_aviso && !inputs.sondar }}
        env:
          CALLMEBOT_WHATSAPP: ${{ secrets.CALLMEBOT_WHATSAPP }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CONVITE_EMAIL: ${{ secrets.CONVITE_EMAIL }}
          CONVITE_SENHA: ${{ secrets.CONVITE_SENHA }}
          CONVITE_PARA: ${{ secrets.CONVITE_PARA }}
        run: python -m calendario_b3 --testar-aviso

      - name: Ler cronograma da B3 e gerar .ics
        if: ${{ !inputs.inspecionar && !inputs.testar_aviso && !inputs.sondar }}
        env:
          CALLMEBOT_WHATSAPP: ${{ secrets.CALLMEBOT_WHATSAPP }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CONVITE_EMAIL: ${{ secrets.CONVITE_EMAIL }}
          CONVITE_SENHA: ${{ secrets.CONVITE_SENHA }}
          CONVITE_PARA: ${{ secrets.CONVITE_PARA }}
        run: python -m calendario_b3

      - name: Commit se houve mudança
        if: ${{ !inputs.inspecionar && !inputs.testar_aviso && !inputs.sondar }}
        run: |
          git add dados/ publico/calendario.ics
          if git diff --cached --quiet; then
            echo "Sem mudanças no calendário."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Atualiza calendário de resultados ($(date -u +%Y-%m-%dT%H:%MZ))"
            # Outro commit pode ter chegado durante a rodada: integra antes de enviar (o estado dos
            # convites não pode se perder, senão o mesmo convite sai de novo).
            git pull --rebase -X theirs origin main || git pull --rebase origin main
            git push
          fi
